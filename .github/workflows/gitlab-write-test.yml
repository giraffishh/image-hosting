name: GitLab Real Write Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/gitlab-write-test.yml

permissions:
  contents: write

jobs:
  test-write:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test image pushes with HTTP compatibility settings
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -u

          FIRST_COMMIT="96c0dcd75ebc5193126c2c8b4c347bf765765597"
          SECOND_COMMIT="6cdcf63db01beb6c14ac744ab8a7bf54195795d6"
          TEST_BRANCH="refs/heads/github-write-test"

          AUTH_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_URL}"
          git remote add gitlab "${AUTH_URL}"
          git fetch --no-tags gitlab main
          GITLAB_MAIN_SHA="$(git rev-parse FETCH_HEAD)"

          # Work around proxies that mishandle large/chunked smart-HTTP POSTs.
          git config http.version HTTP/1.1
          git config http.postBuffer 104857600

          set +e
          OUT1="$(git push gitlab "${FIRST_COMMIT}:${TEST_BRANCH}" --force 2>&1)"
          CODE1=$?
          set -e
          SAFE_OUT1="${OUT1//${GITLAB_TOKEN}/***}"

          CODE2="not-run"
          SAFE_OUT2="not-run"
          if [ "${CODE1}" -eq 0 ]; then
            set +e
            OUT2="$(git push gitlab "${SECOND_COMMIT}:${TEST_BRANCH}" --force 2>&1)"
            CODE2=$?
            set -e
            SAFE_OUT2="${OUT2//${GITLAB_TOKEN}/***}"
          fi

          DELETE_CODE="not-run"
          SAFE_DELETE_OUTPUT="not-run"
          if [ "${CODE1}" -eq 0 ]; then
            set +e
            DELETE_OUTPUT="$(git push gitlab --delete github-write-test 2>&1)"
            DELETE_CODE=$?
            set -e
            SAFE_DELETE_OUTPUT="${DELETE_OUTPUT//${GITLAB_TOKEN}/***}"
          fi

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "gitlab_main_sha=${GITLAB_MAIN_SHA}"
            echo "http_version=HTTP/1.1"
            echo "http_post_buffer=104857600"
            echo "first_push_exit_code=${CODE1}"
            echo "second_push_exit_code=${CODE2}"
            echo "delete_exit_code=${DELETE_CODE}"
            echo
            echo "--- first image commit push ---"
            echo "${SAFE_OUT1}"
            echo
            echo "--- second image commit push ---"
            echo "${SAFE_OUT2}"
            echo
            echo "--- delete output ---"
            echo "${SAFE_DELETE_OUTPUT}"
          } > /tmp/gitlab-write-test-result.txt

      - name: Publish test result back to GitHub
        run: |
          cp /tmp/gitlab-write-test-result.txt gitlab-write-test-result.txt
          git add gitlab-write-test-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record GitLab HTTP compatibility test result"
          git push origin main
