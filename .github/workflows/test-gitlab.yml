name: Test GitLab Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gitlab:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test GitLab public connectivity
        env:
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
        run: |
          set -u

          GITLAB_HOST="${GITLAB_URL%%/*}"

          echo "======================================"
          echo "Test 1: DNS resolution"
          echo "======================================"
          echo "GitLab host: ${GITLAB_HOST}"
          echo

          getent ahosts "${GITLAB_HOST}" || true

          echo
          echo "======================================"
          echo "Test 2: HTTPS connectivity"
          echo "======================================"

          HTTP_CODE=$(
            curl \
              --silent \
              --show-error \
              --location \
              --output /dev/null \
              --max-time 20 \
              --write-out "%{http_code}" \
              "https://${GITLAB_HOST}/git/" \
              || true
          )

          echo "HTTP status: ${HTTP_CODE}"

          case "${HTTP_CODE}" in
            200|301|302|303|307|308)
              echo "✅ GitLab public HTTPS endpoint is reachable."
              ;;
            401|403)
              echo "⚠️ GitLab is reachable, but access is restricted."
              ;;
            500)
              echo "❌ GitLab returned HTTP 500."
              echo "   This strongly suggests a server/proxy/network-side problem."
              ;;
            000)
              echo "❌ Could not establish an HTTPS connection to GitLab."
              ;;
            *)
              echo "⚠️ Unexpected HTTP status: ${HTTP_CODE}"
              ;;
          esac

      - name: Test GitLab token authentication
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Test 3: Git authentication"
          echo "======================================"

          AUTH_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_URL}"

          if git ls-remote "${AUTH_URL}" > /tmp/gitlab_refs.txt; then
            echo "✅ Token authentication succeeded."
            echo
            echo "Remote refs:"
            head -n 10 /tmp/gitlab_refs.txt
          else
            echo "❌ Token authentication failed."
            echo
            echo "Possible causes:"
            echo "  - GitLab public endpoint is still returning 500"
            echo "  - Token is invalid or expired"
            echo "  - Token does not have repository permission"
            exit 1
          fi

      - name: Test GitLab push permission
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_URL: ${{ secrets.GITLAB_URL }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail

          echo "======================================"
          echo "Test 4: Push permission"
          echo "======================================"

          AUTH_URL="https://oauth2:${GITLAB_TOKEN}@${GITLAB_URL}"

          echo "Target branch: ${GITHUB_REF_NAME}"
          echo

          git push \
            --dry-run \
            "${AUTH_URL}" \
            "HEAD:refs/heads/${GITHUB_REF_NAME}" \
            --force

          echo
          echo "✅ Push permission test succeeded."
          echo "✅ No changes were actually written to GitLab."
