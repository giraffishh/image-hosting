name: GitLab API Tiny Write Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/sync-to-gitlab.yml

permissions:
  contents: write

jobs:
  api-write-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Test tiny GitLab API commit
        env:
          GITLAB_API_TOKEN: ${{ secrets.GITLAB_API_TOKEN }}
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          set -u

          if [ -n "${GITLAB_API_TOKEN:-}" ]; then
            API_TOKEN="${GITLAB_API_TOKEN}"
            TOKEN_SOURCE="GITLAB_API_TOKEN"
          else
            API_TOKEN="${GITLAB_TOKEN:-}"
            TOKEN_SOURCE="GITLAB_TOKEN"
          fi

          API_BASE="https://mirrors.sustech.edu.cn/git/api/v4"
          PROJECT="giraffish%2Fimage-hosting"
          TEST_BRANCH="github-api-write-test"

          if [ -z "${API_TOKEN}" ]; then
            {
              echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "token_source=none"
              echo "create_http_code=000"
              echo "error=no_token_available"
            } > /tmp/gitlab-api-test-result.txt
            exit 0
          fi

          cat > /tmp/payload.json <<'JSON'
          {
            "branch": "github-api-write-test",
            "start_branch": "main",
            "commit_message": "Temporary tiny GitLab API write test",
            "actions": [
              {
                "action": "create",
                "file_path": "gitlab-api-tiny-test.txt",
                "content": "hello from github actions"
              }
            ]
          }
          JSON

          PREDELETE_CODE=$(
            curl --silent --show-error \
              --request DELETE \
              --header "PRIVATE-TOKEN: ${API_TOKEN}" \
              --output /tmp/predelete-body.txt \
              --write-out "%{http_code}" \
              --max-time 30 \
              "${API_BASE}/projects/${PROJECT}/repository/branches/${TEST_BRANCH}" \
              || true
          )

          CREATE_CODE=$(
            curl --silent --show-error \
              --request POST \
              --header "PRIVATE-TOKEN: ${API_TOKEN}" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/payload.json \
              --output /tmp/create-body.txt \
              --write-out "%{http_code}" \
              --max-time 30 \
              "${API_BASE}/projects/${PROJECT}/repository/commits" \
              || true
          )

          DELETE_CODE="not-run"
          if [ "${CREATE_CODE}" = "201" ]; then
            DELETE_CODE=$(
              curl --silent --show-error \
                --request DELETE \
                --header "PRIVATE-TOKEN: ${API_TOKEN}" \
                --output /tmp/delete-body.txt \
                --write-out "%{http_code}" \
                --max-time 30 \
                "${API_BASE}/projects/${PROJECT}/repository/branches/${TEST_BRANCH}" \
                || true
            )
          fi

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "token_source=${TOKEN_SOURCE}"
            echo "payload_size_bytes=$(wc -c < /tmp/payload.json)"
            echo "predelete_http_code=${PREDELETE_CODE}"
            echo "create_http_code=${CREATE_CODE}"
            echo "delete_http_code=${DELETE_CODE}"
            echo
            echo "--- predelete response ---"
            cat /tmp/predelete-body.txt 2>/dev/null || true
            echo
            echo "--- create response ---"
            cat /tmp/create-body.txt 2>/dev/null || true
            echo
            echo "--- delete response ---"
            cat /tmp/delete-body.txt 2>/dev/null || true
          } > /tmp/gitlab-api-test-result.txt

      - name: Publish API test result to GitHub
        if: always()
        run: |
          if [ ! -f /tmp/gitlab-api-test-result.txt ]; then
            {
              echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              echo "workflow_failed_before_result=true"
            } > /tmp/gitlab-api-test-result.txt
          fi

          git switch main
          cp /tmp/gitlab-api-test-result.txt gitlab-api-test-result.txt
          git add gitlab-api-test-result.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Record tiny GitLab API test result"
          git push origin main
